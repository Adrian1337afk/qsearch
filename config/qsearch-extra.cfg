
/** QSEARCH SETTINGS
 *
 * Appended to the LibreWolf settings above by scripts/apply.py.
 * The two privacy modes (Strict / Maximum) live in
 * browser/components/qsearch/QSearchPrivacy.sys.mjs, not here.
 */

// Privacy mode chosen with the toolbar button: "strict" or "max".
defaultPref("qsearch.privacy.mode", "strict");

// DNS-over-HTTPS resolver used by both modes (Quad9, no logging of IPs).
defaultPref("network.trr.uri", "https://dns.quad9.net/dns-query");
defaultPref("network.trr.default_provider_uri", "https://dns.quad9.net/dns-query");

// Always on, in both modes.
defaultPref("dom.security.https_only_mode", true);
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("browser.contentblocking.category", "strict");

// Expose Mozilla Account sign-in and Sync in Settings.
defaultPref("identity.fxaccounts.enabled", true);

// DRM (Netflix, Spotify, ...) works out of the box. This undoes the LibreWolf
// DRM section above: Widevine is downloaded from Mozilla's plugin server on
// first start and sites may use it without a permission prompt.
defaultPref("media.eme.enabled", true);
defaultPref("media.eme.require-app-approval", false);
defaultPref("permissions.default.media-key-system-access", 1);
defaultPref("media.gmp-provider.enabled", true);
defaultPref("media.gmp-widevinecdm.visible", true);
defaultPref("media.gmp-widevinecdm.enabled", true);
defaultPref("media.gmp-manager.url", "https://aus5.mozilla.org/update/3/GMP/%VERSION%/%BUILD_ID%/%BUILD_TARGET%/%LOCALE%/%CHANNEL%/%OS_VERSION%/%DISTRIBUTION%/%DISTRIBUTION_VERSION%/update.xml");

// "Learn more" links open Mozilla's help article for that setting: qsearch
// has the same settings, so those articles are the right documentation.
// (The "qsearch support" button in Settings goes to GitHub; scripts/apply.py
// sets that link.)
defaultPref("app.support.baseURL", "https://support.mozilla.org/1/firefox/%VERSION%/%OS%/%LOCALE%/");
// Feedback and release links go to the qsearch GitHub page.
defaultPref("app.feedback.baseURL", "https://github.com/Adrian1337afk/qsearch/issues");
defaultPref("app.releaseNotesURL", "https://github.com/Adrian1337afk/qsearch/releases");
defaultPref("app.releaseNotesURL.aboutDialog", "https://github.com/Adrian1337afk/qsearch/releases");
defaultPref("app.update.url.details", "https://github.com/Adrian1337afk/qsearch/releases");
defaultPref("app.update.url.manual", "https://github.com/Adrian1337afk/qsearch/releases");
defaultPref("browser.search.searchEnginesURL", "https://github.com/Adrian1337afk/qsearch#search-engines");
defaultPref("browser.geolocation.warning.infoURL", "https://github.com/Adrian1337afk/qsearch#location");
defaultPref("librewolf.eme.warning.infoURL", "https://github.com/Adrian1337afk/qsearch#drm");

// Compact, customizable UI.
defaultPref("browser.compactmode.show", true);
defaultPref("browser.uidensity", 1);
defaultPref("browser.tabs.groups.enabled", true);
defaultPref("sidebar.revamp", true); // enables the vertical-tabs option in Customize sidebar
defaultPref("browser.toolbars.bookmarks.visibility", "never");
// Let users restyle the UI further with userChrome.css.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Search: custom engines can be added in Settings > Search.
defaultPref("browser.urlbar.update2.engineAliasRefresh", true);

// No sponsored content anywhere.
lockPref("browser.newtabpage.activity-stream.showSponsoredCheckboxes", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.showSponsored", false);

// New tab page: search box and shortcuts only.
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", true);
defaultPref("browser.newtabpage.activity-stream.showSearch", true);

// ---- qsearch features (see QSearchFeatures.sys.mjs) ----
// Layout: "classic", "compact", "vertical" or "frameless".
defaultPref("qsearch.layout", "vertical");
// Accent colour as #rrggbb, empty = lime from the logo.
defaultPref("qsearch.accent", "");
defaultPref("qsearch.cookies.autoDelete", false);
defaultPref("qsearch.containers.auto", true);
// Private windows through a SOCKS proxy (Tor listens on 127.0.0.1:9050).
defaultPref("qsearch.proxy.private.enabled", false);
defaultPref("qsearch.proxy.private.host", "127.0.0.1");
defaultPref("qsearch.proxy.private.port", 9050);
defaultPref("qsearch.newtab.enabled", true);
defaultPref("qsearch.home.search", true);
defaultPref("qsearch.home.shortcuts", true);
defaultPref("qsearch.home.shortcutRows", 1);
defaultPref("qsearch.home.activity", false);
defaultPref("qsearch.home.logo", true);
defaultPref("qsearch.home.clock", true);
defaultPref("qsearch.home.stats", true);
defaultPref("qsearch.firstrun.done", false);
// Daily look at github.com for a newer release. Nothing is installed.
defaultPref("qsearch.update.check", true);

// Split view, tab groups, "copy clean link" and the address bar's actions
// mode (command palette, Ctrl+K) are Firefox features that stay on.
defaultPref("browser.tabs.splitView.enabled", true);
defaultPref("privacy.query_stripping.strip_on_share.enabled", true);
defaultPref("browser.urlbar.scotchBonnet.enableOverride", true);
// Counts blocked trackers locally for the new tab page.
defaultPref("browser.contentblocking.database.enabled", true);
// No "drag tabs here" promo card in the vertical tab strip.
defaultPref("sidebar.verticalTabs.dragToPinPromo.dismissed", true);

// Default layout is vertical tabs. These must be defaults from the very
// start: Firefox reads the tab orientation before qsearch's own code runs.
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.visibility", "expand-on-hover");
defaultPref("qsearch.layout.applied", "vertical");
